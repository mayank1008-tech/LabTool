<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LabTool – Upload Template</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.8rem; color: #38bdf8; }
    p.subtitle { margin: 0 0 1.75rem; color: #94a3b8; font-size: 0.9rem; }
    nav { margin-bottom: 1.5rem; }
    nav a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.88rem;
      margin-right: 1rem;
    }
    nav a:hover { text-decoration: underline; }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.25rem;
      margin-top: 1rem;
    }
    .drop-zone {
      border: 2px dashed #334155;
      border-radius: 10px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 1rem;
    }
    .drop-zone.dragover { border-color: #38bdf8; background: #1e3a5f44; }
    .drop-zone input[type="file"] { display: none; }
    .drop-zone p { margin: 0; color: #64748b; font-size: 0.95rem; }
    .drop-zone p.chosen { color: #e2e8f0; font-weight: 600; }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background: #0ea5e9;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #38bdf8; }
    button:disabled { background: #334155; cursor: not-allowed; }
    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      display: none;
    }
    #result.success {
      background: #064e3b;
      border: 1px solid #059669;
      display: block;
    }
    #result.error {
      background: #450a0a;
      border: 1px solid #dc2626;
      display: block;
    }
    #result h3 { margin: 0 0 0.5rem; font-size: 1rem; }
    #result a { color: #38bdf8; font-weight: 600; text-decoration: none; }
    #result a:hover { text-decoration: underline; }
    code { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚗️ LabTool</h1>
    <p class="subtitle">M2 – Upload your DOCX template to create a reusable profile.</p>

    <nav>
      <a href="/">🏠 Generate Report</a>
      <a href="/upload-template">📤 Upload Template</a>
      <a href="/docs" target="_blank">📚 API Docs</a>
    </nav>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".docx" />
      <p id="dropLabel">Drag &amp; drop a <strong>.docx</strong> file here, or <strong>click to browse</strong></p>
    </div>

    <button id="uploadBtn" disabled>Upload Template</button>

    <div id="result"></div>
  </div>

  <script>
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const dropLabel = document.getElementById("dropLabel");
    const uploadBtn = document.getElementById("uploadBtn");
    const resultDiv = document.getElementById("result");
    let selectedFile = null;

    dropZone.addEventListener("click", () => fileInput.click());

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const f = e.dataTransfer.files[0];
      if (f) handleFile(f);
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(f) {
      if (!f.name.toLowerCase().endsWith(".docx")) {
        showError("Only .docx files are accepted.");
        return;
      }
      selectedFile = f;
      dropLabel.textContent = "";
      const chosen = document.createElement("p");
      chosen.className = "chosen";
      const sizeStr = f.size >= 1024 * 1024
        ? `${(f.size / (1024 * 1024)).toFixed(1)} MB`
        : `${(f.size / 1024).toFixed(1)} KB`;
      chosen.textContent = `✔ ${f.name} (${sizeStr})`;
      dropLabel.parentNode.replaceChild(chosen, dropLabel);
      uploadBtn.disabled = false;
    }

    uploadBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading…";
      resultDiv.className = "";
      resultDiv.style.display = "none";

      const form = new FormData();
      form.append("file", selectedFile);

      try {
        const resp = await fetch("/templates/upload", { method: "POST", body: form });
        const data = await resp.json();

        if (resp.ok) {
          resultDiv.className = "success";
          resultDiv.innerHTML = `
            <h3>✅ Template uploaded successfully!</h3>
            <p>Template ID: <strong>${data.template_id}</strong></p>
            <p>Paragraphs: ${data.paragraph_count} &nbsp;|&nbsp; Tables: ${data.table_count}</p>
            <a href="/confirm-mapping?template_id=${encodeURIComponent(data.template_id)}">
              ➡ Continue to Mapping Confirmation
            </a>
          `;
        } else {
          const msg = data.detail || JSON.stringify(data);
          showError(msg);
        }
      } catch (err) {
        showError(err.message);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload Template";
      }
    });

    function showError(msg) {
      resultDiv.className = "error";
      resultDiv.innerHTML = `<h3>❌ Error</h3><p>${msg}</p>`;
    }
  </script>
</body>
</html>
